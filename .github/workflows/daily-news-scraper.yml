# Daily News Scraper
#
# Schedule: 03:00 UTC daily = 06:00 EAT. GitHub Actions cron is always UTC,
# and Ethiopia (EAT) is UTC+3, so the offset must be applied by hand.
#
# Required secret:
#   Repository -> Settings -> Secrets and variables -> Actions -> DATABASE_URL
#
# The .env file is local only and is never committed. In CI the connection
# string comes from the secret above, and db.database.load_dotenv() simply
# finds nothing to load.

name: Daily News Scraper

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

concurrency:
  # Never let two nightly runs overlap against the same database.
  group: daily-news-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run all news scrapers
        env:
          # Repository -> Settings -> Secrets and variables -> Actions
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/run_daily.py
